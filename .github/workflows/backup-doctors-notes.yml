name: Back up Doctor's Notes

on:
  workflow_dispatch:
  push:
    branches:
      - blog-backup-2026-09-04
    paths:
      - ".github/workflows/backup-doctors-notes.yml"
      - "scripts/backup_doctors_notes.py"

permissions:
  contents: write

concurrency:
  group: doctors-notes-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out backup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backup dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 markdownify

      - name: Guard against decomposed Bandzoogle markup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/backup_doctors_notes.py")
          text = path.read_text(encoding="utf-8")
          needle = """    for tag in list(fragment.find_all(True)):\n        descriptor = \" \".join(\n"""
          replacement = """    for tag in list(fragment.find_all(True)):\n        # Decomposing a parent leaves its former children in this prebuilt list\n        # with attrs=None. Skip those detached nodes before calling Tag.get().\n        if tag.attrs is None:\n            continue\n        descriptor = \" \".join(\n"""
          if needle in text:
              path.write_text(text.replace(needle, replacement, 1), encoding="utf-8")
              print("Patched the decomposed-node guard.")
          elif "if tag.attrs is None:" in text:
              print("The decomposed-node guard is already present.")
          else:
              raise SystemExit("Could not locate the parser block to patch.")
          PY

      - name: Crawl and back up Doctor's Notes
        id: crawl
        continue-on-error: true
        run: python scripts/backup_doctors_notes.py

      - name: Show crawler report
        if: always()
        shell: bash
        run: |
          if [[ -f archive/doctors-notes/backup-report.md ]]; then
            cat archive/doctors-notes/backup-report.md
          else
            echo "The crawler did not create a report."
          fi

      - name: Validate the backup
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("archive/doctors-notes/manifest.json").read_text(encoding="utf-8"))
          discovered = manifest["posts_discovered"]
          backed_up = manifest["posts_backed_up"]
          images = manifest["unique_images_in_backup"]
          errors = manifest["post_errors"]

          print(f"Discovered: {discovered}")
          print(f"Backed up: {backed_up}")
          print(f"Unique images: {images}")
          print(f"Post errors: {len(errors)}")

          if discovered < 21:
              raise SystemExit(f"Expected at least 21 posts, found {discovered}.")
          if backed_up != discovered:
              raise SystemExit(f"Only {backed_up} of {discovered} posts were backed up.")
          if errors:
              raise SystemExit(f"The backup contains {len(errors)} post errors.")
          PY

      - name: Build portable ZIP
        run: |
          python - <<'PY'
          import shutil
          shutil.make_archive(
              "doctors-notes-backup-2026-09-04",
              "zip",
              root_dir="archive",
              base_dir="doctors-notes",
          )
          PY

      - name: Upload portable backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: doctors-notes-backup-2026-09-04
          path: doctors-notes-backup-2026-09-04.zip
          if-no-files-found: error
          retention-days: 90

      - name: Commit the durable backup to the archive branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/backup_doctors_notes.py archive/doctors-notes
          if git diff --cached --quiet; then
            echo "No backup changes to commit."
            exit 0
          fi
          git commit -m "Back up Doctor's Notes posts and images"
          git push origin "HEAD:${GITHUB_REF_NAME}"

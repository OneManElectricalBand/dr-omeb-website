name: Build native Doctor's Notes once

on:
  push:
    branches:
      - native-doctors-notes-v1
    paths:
      - ".github/workflows/build-native-doctors-notes-once.yml"
      - "scripts/.generate-doctors-notes-once.py"
      - "scripts/.doctors-notes-payload-*.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-doctors-notes-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: native-doctors-notes-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize staged generator payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          first_path = Path('scripts/.doctors-notes-payload-1.txt')
          other_paths = [Path(f'scripts/.doctors-notes-payload-{i}.txt') for i in range(2, 6)]
          expected_length = 8500
          expected_sha = '994ce5736e6db3cf3d1d768120d60c18d87610961555d3781faa65730c2ae6b1'
          first = first_path.read_text(encoding='utf-8')
          tail = ''.join(path.read_text(encoding='utf-8') for path in other_paths)
          current = first + tail

          if hashlib.sha256(current.encode()).hexdigest() == expected_sha:
              print('Staged payload already matches its checksum.')
              raise SystemExit(0)

          extra = len(first) - expected_length
          if extra <= 0:
              raise SystemExit('The staged first payload segment is shorter than expected.')

          for offset in range(len(first) - extra + 1):
              candidate_first = first[:offset] + first[offset + extra:]
              candidate = candidate_first + tail
              if hashlib.sha256(candidate.encode()).hexdigest() == expected_sha:
                  first_path.write_text(candidate_first, encoding='utf-8')
                  print(f'Removed {extra} duplicated staging characters at offset {offset}.')
                  break
          else:
              raise SystemExit('Could not restore the checksum-verified payload.')
          PY

      - name: Generate native publication
        run: python scripts/.generate-doctors-notes-once.py

      - name: Validate pages, feed, sitemap and local assets
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          ROOT = Path('.')
          EXPECTED_SLUGS = {
              'how-tiktok-livestreaming-rewired-my-marketing-brain',
              'nobody-owes-you-attention',
              'streaming-royalties-better-room',
              'tiktok-ads-experiment',
              'kiss-war-for-attention',
              'ai-does-not-replace-taste',
              'ai-music-video-independent-artist',
          }

          class PageParser(HTMLParser):
              def __init__(self) -> None:
                  super().__init__()
                  self.h1_count = 0
                  self.canonicals: list[str] = []
                  self.images: list[tuple[str, str | None]] = []
                  self.links: list[str] = []
                  self.og_title = False
                  self.og_description = False
                  self.json_ld: list[str] = []
                  self._json_depth = 0
                  self._json_chunks: list[str] = []

              def handle_starttag(self, tag: str, attrs_list: list[tuple[str, str | None]]) -> None:
                  attrs = dict(attrs_list)
                  if tag == 'h1':
                      self.h1_count += 1
                  if tag == 'link' and attrs.get('rel') == 'canonical' and attrs.get('href'):
                      self.canonicals.append(str(attrs['href']))
                  if tag == 'meta' and attrs.get('property') == 'og:title':
                      self.og_title = bool(attrs.get('content'))
                  if tag == 'meta' and attrs.get('property') == 'og:description':
                      self.og_description = bool(attrs.get('content'))
                  if tag == 'img' and attrs.get('src'):
                      self.images.append((str(attrs['src']), attrs.get('alt')))
                  if tag == 'a' and attrs.get('href'):
                      self.links.append(str(attrs['href']))
                  if tag == 'script' and attrs.get('type') == 'application/ld+json':
                      self._json_depth = 1
                      self._json_chunks = []

              def handle_endtag(self, tag: str) -> None:
                  if tag == 'script' and self._json_depth:
                      self.json_ld.append(''.join(self._json_chunks).strip())
                      self._json_depth = 0

              def handle_data(self, data: str) -> None:
                  if self._json_depth:
                      self._json_chunks.append(data)

          errors: list[str] = []
          article_pages = sorted((ROOT / 'blog').glob('*/index.html'))
          actual_slugs = {path.parent.name for path in article_pages}
          if actual_slugs != EXPECTED_SLUGS:
              errors.append(f'Article slugs mismatch: {sorted(actual_slugs)}')

          pages = [ROOT / 'blog/index.html', ROOT / 'terms/index.html', *article_pages]
          for path in pages:
              if not path.exists():
                  errors.append(f'Missing page: {path}')
                  continue
              text = path.read_text(encoding='utf-8')
              parser = PageParser()
              parser.feed(text)
              if parser.h1_count != 1:
                  errors.append(f'{path}: expected one H1, found {parser.h1_count}')
              if len(parser.canonicals) != 1:
                  errors.append(f'{path}: expected one canonical link')
              if not parser.og_title or not parser.og_description:
                  errors.append(f'{path}: missing Open Graph title or description')
              if path in article_pages:
                  if not parser.json_ld:
                      errors.append(f'{path}: missing JSON-LD')
                  else:
                      try:
                          data = json.loads(parser.json_ld[0])
                          if data.get('@type') != 'BlogPosting':
                              errors.append(f'{path}: JSON-LD is not BlogPosting')
                      except Exception as exc:
                          errors.append(f'{path}: invalid JSON-LD ({exc})')
              for src, alt in parser.images:
                  if not alt or not alt.strip():
                      errors.append(f'{path}: image missing alt text: {src}')
                  if src.startswith('/'):
                      local = ROOT / src.lstrip('/')
                      if not local.exists():
                          errors.append(f'{path}: missing local image: {src}')
              for href in parser.links:
                  if not href.startswith('/blog/') or href in {'/blog/', '/blog/rss.xml'}:
                      continue
                  target = ROOT / urlparse(href).path.lstrip('/')
                  exists = target.exists() if target.suffix else (target / 'index.html').exists()
                  if not exists:
                      errors.append(f'{path}: broken internal blog link: {href}')

          feed = ET.parse(ROOT / 'blog/rss.xml').getroot()
          items = feed.findall('./channel/item')
          if len(items) != 7:
              errors.append(f'RSS expected 7 items, found {len(items)}')
          for item in items:
              if not item.findtext('title') or not item.findtext('link') or not item.findtext('pubDate'):
                  errors.append('RSS item missing title, link or pubDate')

          sitemap = ET.parse(ROOT / 'sitemap.xml').getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locations = [node.text for node in sitemap.findall('sm:url/sm:loc', ns)]
          if len(locations) != 16:
              errors.append(f'Sitemap expected 16 URLs, found {len(locations)}')
          for slug in EXPECTED_SLUGS:
              expected = f'https://onemanelectricalband.com/blog/{slug}/'
              if expected not in locations:
                  errors.append(f'Sitemap missing {expected}')

          redirects = (ROOT / '_redirects').read_text(encoding='utf-8')
          for slug in EXPECTED_SLUGS:
              if f'/blog/{slug}/' not in redirects:
                  errors.append(f'Redirect file missing destination for {slug}')
          if 'Moving to Substack' in (ROOT / 'blog/index.html').read_text(encoding='utf-8'):
              errors.append('Old Substack placeholder survived in blog landing page')

          if errors:
              print('\n'.join(f'ERROR: {error}' for error in errors))
              raise SystemExit(1)

          print('VALIDATION PASS')
          print(f'HTML pages: {len(pages)}')
          print(f'RSS items: {len(items)}')
          print(f'Sitemap URLs: {len(locations)}')
          PY
          git diff --check

      - name: Remove one-time build machinery
        shell: bash
        run: |
          rm -f \
            scripts/.generate-doctors-notes-once.py \
            scripts/.doctors-notes-payload-1.txt \
            scripts/.doctors-notes-payload-2.txt \
            scripts/.doctors-notes-payload-3.txt \
            scripts/.doctors-notes-payload-4.txt \
            scripts/.doctors-notes-payload-5.txt \
            .github/workflows/build-native-doctors-notes-once.yml

      - name: Commit the review build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build native Doctor's Notes launch section"
          git push origin HEAD:native-doctors-notes-v1

name: Visual audit Doctor's Notes once

on:
  push:
    branches:
      - native-doctors-notes-v1
    paths:
      - ".github/workflows/visual-audit-doctors-notes-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: native-doctors-notes-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/doctors-notes-server.log 2>&1 &
          echo $! > /tmp/doctors-notes-server.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/blog/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/doctors-notes-server.log
          exit 1

      - name: Capture desktop and mobile pages
        shell: bash
        run: |
          cat > /tmp/visual-audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const output = 'visual-audit';
          await fs.mkdir(output, { recursive: true });

          const pages = [
            ['blog-home', '/blog/'],
            ['tiktok-livestream', '/blog/how-tiktok-livestreaming-rewired-my-marketing-brain/'],
            ['attention-no-image', '/blog/nobody-owes-you-attention/'],
            ['royalty-research', '/blog/streaming-royalties-better-room/'],
            ['tiktok-ad-table', '/blog/tiktok-ads-experiment/'],
            ['ai-video-embed', '/blog/ai-music-video-independent-artist/'],
          ];
          const viewports = [
            ['desktop', { width: 1440, height: 1000 }],
            ['mobile', { width: 390, height: 844 }],
          ];
          const failures = [];
          const report = [];

          for (const [viewportName, viewport] of viewports) {
            const context = await browser.newContext({ viewport, deviceScaleFactor: 1 });
            for (const [pageName, path] of pages) {
              const page = await context.newPage();
              const consoleErrors = [];
              page.on('console', message => {
                if (message.type() === 'error') consoleErrors.push(message.text());
              });
              page.on('pageerror', error => consoleErrors.push(error.message));

              const response = await page.goto(`http://127.0.0.1:8000${path}`, {
                waitUntil: 'networkidle',
                timeout: 30000,
              });
              if (!response || !response.ok()) {
                failures.push(`${viewportName}/${pageName}: page returned ${response?.status() ?? 'no response'}`);
              }

              const audit = await page.evaluate(() => {
                const root = document.documentElement;
                const images = [...document.images];
                const failedImages = images
                  .filter(image => image.complete && image.naturalWidth === 0)
                  .map(image => image.getAttribute('src'));
                const overflowing = [...document.querySelectorAll('body *')]
                  .filter(element => {
                    const rect = element.getBoundingClientRect();
                    return rect.right > window.innerWidth + 2 || rect.left < -2;
                  })
                  .slice(0, 12)
                  .map(element => `${element.tagName.toLowerCase()}.${[...element.classList].join('.')}`);
                return {
                  title: document.title,
                  h1: document.querySelector('h1')?.textContent?.trim() ?? '',
                  scrollWidth: root.scrollWidth,
                  viewportWidth: window.innerWidth,
                  failedImages,
                  overflowing,
                };
              });

              if (audit.scrollWidth > audit.viewportWidth + 2) {
                failures.push(`${viewportName}/${pageName}: horizontal document overflow ${audit.scrollWidth}px > ${audit.viewportWidth}px`);
              }
              if (audit.failedImages.length) {
                failures.push(`${viewportName}/${pageName}: failed local images ${audit.failedImages.join(', ')}`);
              }
              const meaningfulOverflow = audit.overflowing.filter(item => !item.startsWith('table.') && !item.startsWith('iframe.'));
              if (meaningfulOverflow.length) {
                failures.push(`${viewportName}/${pageName}: overflowing elements ${meaningfulOverflow.join(', ')}`);
              }
              if (consoleErrors.length) {
                failures.push(`${viewportName}/${pageName}: console errors ${consoleErrors.join(' | ')}`);
              }

              await page.screenshot({
                path: `${output}/${viewportName}-${pageName}.png`,
                fullPage: true,
              });
              report.push({ viewportName, pageName, path, ...audit, consoleErrors });
              await page.close();
            }
            await context.close();
          }

          await fs.writeFile(`${output}/visual-audit.json`, JSON.stringify({ report, failures }, null, 2));
          await browser.close();

          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(`Captured ${report.length} screenshots with no image, console, or horizontal-overflow failures.`);
          JS
          node /tmp/visual-audit.mjs

      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctors-notes-visual-audit
          path: visual-audit/
          if-no-files-found: error
          retention-days: 30

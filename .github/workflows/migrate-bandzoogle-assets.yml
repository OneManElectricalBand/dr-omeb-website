name: Migrate Bandzoogle assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/migrate-bandzoogle-assets.yml"
      - "scripts/migrate_bandzoogle_assets.py"

permissions:
  contents: write

concurrency:
  group: bandzoogle-asset-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Crawl live Bandzoogle site and archive images
        run: python scripts/migrate_bandzoogle_assets.py

      - name: Commit archived assets and migration report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/migrated assets/image-manifest.json assets/image-migration-report.md
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Archive Bandzoogle site images"
          git push

# Trigger revision: workflow now existed on main before this push.
